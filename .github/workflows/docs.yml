# Keep the GitHub Pages site (served from main:/docs) in lock-step with the packages.
# On every push to main, regenerate the site from package source (@suluk/docs harvests each
# package's package.json + README + exports) and commit the result back — so the published
# docs are a projection of the packages and cannot drift.
name: Docs site

on:
  push:
    branches: ["main"]
    # Don't retrigger on our own commit-back (which only touches docs/).
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

# Needed to commit the regenerated site back to the branch.
permissions:
  contents: write

concurrency:
  group: "docs-regen"
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Regenerate the docs site from package source → ./docs
        run: bun tooling/ts/scripts/gen-docs.ts
      - name: Commit the regenerated site if it changed
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            # [skip ci] + the default GITHUB_TOKEN both prevent this push from re-triggering the workflow.
            git commit -m "docs: regenerate Pages site from package source [skip ci]"
            git push
          else
            echo "Docs already up to date — nothing to commit."
          fi
